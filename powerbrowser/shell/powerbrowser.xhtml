<!--
  D-89/D-91/D-94: the entire startup window. No custom browser chrome:
  no tab strip, toolbar, address bar, or menu. One branded loading layer
  (chrome-rendered, no network, no sidecar) painted above one remote
  <browser> element waiting for a URL. Theia's own shell is the UI.
-->
<!--
  width/height/persist are read off the ROOT element by
  xpfe/appshell/AppWindow.cpp's LoadSizeFromXUL (namespace-agnostic, so an
  <html> root works). Without them the window falls back to its 100x100 default
  and the content <browser> below ends up a 0x0 viewport: Theia still loads and
  runs, but lays out into nothing and renders as an empty window. persist makes
  a user's own resize stick across restarts, the same way browser.xhtml does.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      windowtype="powerbrowser:main"
      scrolling="false"
      width="1280"
      height="800"
      persist="screenX screenY width height sizemode"
      >
  <head>
    <meta charset="utf-8"/>
    <meta http-equiv="Content-Security-Policy" content="default-src chrome:"/>
    <title>PowerBrowser</title>
    <link rel="stylesheet" href="chrome://powerbrowser/content/powerbrowser.css"/>
    <script src="chrome://powerbrowser/content/powerbrowser.js"></script>
  </head>
  <body>
    <div id="powerbrowser-loading">PowerBrowser</div>
    <div id="powerbrowser-error">
      <p id="powerbrowser-error-message"></p>
      <div id="powerbrowser-error-controls">
        <button id="powerbrowser-error-retry" type="button">Retry</button>
        <button id="powerbrowser-error-diagnostics" type="button">Details</button>
      </div>
    </div>
    <div id="powerbrowser-diagnostics">
      <div id="powerbrowser-diagnostics-fields"></div>
      <pre id="powerbrowser-diagnostics-log"></pre>
      <button id="powerbrowser-diagnostics-close" type="button">Close</button>
    </div>
    <xul:browser id="powerbrowser-content" type="content" primary="true" remote="true" remoteType="web" src="about:blank" tabindex="-1"/>
  </body>
</html>
