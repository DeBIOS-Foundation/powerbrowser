# Power Browser -- the rebrand manifest.
#
# CFG-01: this file and brand/ are the ONLY two inputs a downstream rebrand
# edits. Change a value here, run `node scripts/generate.mjs`, and the derived
# build surfaces are rewritten under generated/. No other file in the tree is
# touched to change the brand.
#
# This file is also the DEFAULTS layer (D-05): a downstream's own manifest
# overlays it in Phase 7, so every value below is both Power Browser's brand
# and the fallback a partial downstream manifest inherits.
#
# No machine-specific value belongs here. The repo root is derived at generate
# time from the generator's own location (D-04); it is not a setting.
#
# Two placement notes, both load-bearing:
#
#  1. display_name sits under [identity], not under [product]. Every key under
#     [identity] is required, and a required key is one a downstream cannot
#     silently inherit -- omitting it is a hard failure rather than a quiet
#     fallback. display_name is the value that reaches MOZ_APP_DISPLAYNAME, so
#     a downstream that forgot it would otherwise ship this project's mark in
#     its own window title. Putting it in the required table is what stops that.
#
#  2. The vendor is TWO settings, never one. vendor_machine is lowercased and
#     concatenated into the profile directory path with no space stripping, so
#     the display form would produce a path containing a space -- against this
#     repo's hard rule that its path carries no space. Collapsing the two either
#     puts a space in the profile path or ships a vendor string that is not the
#     foundation's name. Keep them distinct.

[product]
vendor_machine = "DeBIOS"
vendor_display = "DeBIOS Foundation"
description = "A rebrandable browser platform: a Gecko shell hosting an Eclipse Theia sidecar as its default GUI."
homepage = "https://powerbrowser.org"

[identity]
display_name = "PowerBrowser"
app_basename = "powerbrowser"
binary_name = "powerbrowser"
remoting_name = "powerbrowser"
distribution_id = "org.debios"

[legal]
license = "PolyForm Noncommercial 1.0.0"
copyright_holder = "DeBIOS Foundation"
trademark_notice = "Power Browser is a trademark of DeBIOS Foundation."

[theia]
default_theme = "dark"

# Build variants. A variant carries no output path: every output path lives in
# the generator's frozen target table, so no value in this file can direct a
# write. branding_dir and objdir below are emitted as CONTENT, never used as a
# write target.

[[variants]]
id = "dev"
name_suffix = " Dev"
branding_dir = "powerbrowser/branding/dev"
objdir = "objdir"

[[variants]]
id = "release"
name_suffix = ""
branding_dir = "powerbrowser/branding/release"
objdir = "objdir-release"

# Installer branding. support_url feeds the NSIS URLInfoAbout and HelpLink
# defines, falling back to product.homepage when absent. tile_color is
# deliberately UNSET: when it is absent the generator omits the tile
# manifest's BackgroundColor line and Windows falls back to its app-tile
# default, so this tree builds through the omission path a partial
# downstream manifest will take. No color is invented here.
[installer]
support_url = "https://powerbrowser.org"

# Product telemetry (TEL-01/TEL-02). level is one of off, crash, error, all
# and defaults to off: an unset level resolves to off with the standard
# D-08 default-echo, so a downstream omitting it inherits off rather than
# a live sender. endpoint is the downstream's own https URL; an enabled
# level with no endpoint fails the generate naming telemetry.endpoint, so
# a sender that can never deliver never builds. endpoint is deliberately
# UNSET here: with level off there is nowhere to send and nothing ever
# leaves the application.
[telemetry]
level = "off"

# Declared sidecar extensions. Each [[extensions]] entry names an Open VSX
# id at an exact version pin, or a direct https URL, plus the sha256 of the
# download archive; the generator resolves them into the application
# package.json's theiaPlugins block and the build downloads and bundles
# them. This project declares none, so the block stays absent. A downstream
# drops an inherited entry by restating the list without it.

# Upstream pins (UPD-01, UPD-02). firefox_esr_tag is the one ESR tag this
# project builds against: scripts/fetch-upstream.sh clones it,
# scripts/rebase-upstream.sh moves to it, and the rebase workflow mirrors
# it. theia_release is the one Theia release this project composes: every
# @theia/* pin in theia/package.json resolutions, every member
# applications/*/package.json and extensions/*/package.json, and the
# resolved @theia tarballs in theia/yarn.lock agree with it (the
# @theia/monaco-editor-core exception carries upstream's own monaco line).
# Edit one value, run `node scripts/generate.mjs`, and every consumer
# follows -- no second copy lives anywhere else in the tree.
[upstreams]
firefox_esr_tag = "FIREFOX_153_1_0esr_RELEASE"
theia_release = "1.74.1"
