# Replays the patch stack onto one upstream ESR tag and verifies the result.
# The owner dispatches it, or the release train calls it, and either way the
# caller passes the tag explicitly. The tag input has no default, so an ESR
# bump edits configuration.toml alone and never this file; this file carries
# no tag at all, and scripts/verify-upstream-pins.mjs asserts both facts.
#
# D-77: there is deliberately no `schedule:` key. A red scheduled job with
# nobody watching is the failure mode PITFALLS #8 warns about; the release
# train is the caller that runs this on a cadence.
#
# The generator, identity and rebase steps run inside `nix develop .#theia`
# because scripts/generate.mjs rasterises brand/mark.svg with the pinned
# inkscape, and only that inkscape reproduces the tracked PNG bytes. That is
# the small Node-side shell. The Gecko toolchain closure does not fit a
# standard GitHub-hosted runner alongside a 5.6 GB Gecko working tree, so
# this job never runs `./mach build`. The toolchain-baseline.sh diff that
# PITFALLS #2 requires after every ESR rebase is an operator step, run
# locally under `nix develop .#firefox` after a successful CI replay.

name: Rebase upstream

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream Firefox-ESR tag to rebase onto"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Upstream Firefox-ESR tag to rebase onto"
        required: true
        type: string

jobs:
  rebase:
    runs-on: ubuntu-latest
    # WR-09 (plan 01-18). This job clones 1.1 GB from a third-party remote and
    # then runs this repo's scripts over the result; it reads and verifies, and
    # pushes nothing. With no `permissions:` block it would inherit the
    # repository-default GITHUB_TOKEN scope, which on many repos is
    # write-capable, and actions/checkout leaves that credential in
    # .git/config for the whole job. A read-only contents scope plus a
    # checkout that does not persist the credential means the token is
    # neither powerful nor present while the third-party tree is on disk.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      # Pinned by SHA, the same action and SHA verify.yml uses. No Gecko
      # closure is fetched: `.#theia` is the Node-side shell only.
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # D-18's permanent gate, run BEFORE the rebase as well as inside it. It
      # is static and needs no build, no Nix and no upstream tree, so it costs
      # seconds and fails fast on a tree that was already dirty -- which keeps
      # a pre-existing residue from being misread as something the replay
      # introduced. Run with NO exception: plan 01-03 hand-wrote the surfaces
      # the codemod could not, so the carve-out was dropped once the bare scan
      # went green.
      #
      # DECIDED, plan 01-15 (closing gap CR-B): this step deliberately does NOT
      # pass --extra-root, and that is not an oversight to be corrected later.
      # At this point in the job no upstream tree has been cloned, and
      # --extra-root on an absent directory is a hard failure by design -- so
      # passing it here would fail every run for a reason unrelated to residual
      # brand strings. The post-replay, upstream-aware scan reaches this
      # workflow through the "Rebase onto requested tag" step below, which runs
      # scripts/rebase-upstream.sh, which passes --extra-root "$UPSTREAM_DIR"
      # itself. Fixing the shell script fixed the workflow; do not add a second
      # scan step here.
      - name: Scan for residual brand strings
        run: node scripts/scan-brand-residue.mjs

      # THE ORDER OF THE NEXT THREE STEPS IS LOAD-BEARING (plan 02-06, D-15).
      #
      # generated/ is git-ignored, so a fresh clone -- which every run of this
      # workflow is -- has no such directory. Running the freshness check FIRST
      # would report all five generated targets as missing on a tree with no
      # defect at all, and a gate that is red for a non-defect is a gate its
      # readers learn to skip.
      #
      # Run after a generate, the freshness check asserts IDEMPOTENCE: that a
      # second run produces the same bytes as the first. That is a real
      # property worth gating, and on a fresh clone it is the only thing this
      # check can truthfully assert.
      #
      # The byte-identity step is last of the three and is independent of both:
      # it emits its comparand into its own temporary directory and compares
      # against the five files tracked in git, so it would pass even if the two
      # steps above had never run. It is Phase 2's acceptance test -- what the
      # generator emits from configuration.toml is byte-for-byte what Phase 1
      # wrote by hand.
      #
      # WHAT THESE THREE ASSERT HERE IS PRE-REPLAY CLEANLINESS, AND ONLY THAT.
      # This comment used to claim the byte-identity step "goes red if an
      # upstream rebase moved one of those five files"; it runs BEFORE the
      # rebase, so it cannot observe what the rebase did. A gate placed ahead of
      # the operation it is meant to characterise reports on the pre-operation
      # tree. Running here is still worth it as a fail-fast -- the same
      # justification the residual-brand scan above is given -- so the step
      # stays and the claim is corrected. The post-replay observation is the
      # step after the rebase below.
      #
      # No ./mach build step belongs here. Nothing this phase produces reaches
      # the compiler: every build consumer still reads the hand-written files.
      - name: Generate the derived build surfaces
        run: nix develop .#theia --command node scripts/generate.mjs

      - name: Check the generated tree is fresh
        run: nix develop .#theia --command node scripts/generate.mjs --check

      - name: Check the generated tree is byte-identical to the tracked files
        run: nix develop .#theia --command node scripts/verify-generated-identity.mjs

      - name: Rebase onto requested tag
        env:
          REBASE_TAG: ${{ inputs.tag }}
        run: nix develop .#theia --command bash scripts/rebase-upstream.sh --tag "$REBASE_TAG"

      # THE POST-REPLAY OBSERVATION. The three generator steps above run before
      # the rebase and so report on the pre-replay tree; this is the one that
      # can see what the replay did to the five build surfaces. It emits its
      # comparand into a temporary directory and compares against the tracked
      # files, so it needs no prior generate and reads nothing under generated/.
      #
      # The pre-replay copy of it is a fail-fast, not a duplicate: red there
      # means the tree arrived broken, red here means the replay broke it, and
      # those send a reader to different places.
      - name: Re-check byte-identity after the replay
        run: nix develop .#theia --command node scripts/verify-generated-identity.mjs
